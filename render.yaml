# Render Blueprint for api-pos (.NET 10 API)
# Deploy: push this repo to GitHub, then in Render → New → Blueprint, pick this repo.
# Values marked `sync: false` are NOT in Git — set them in the Render dashboard.
services:
  - type: web
    name: api-pos
    runtime: docker
    # Starter (not free): api-pos uses SignalR (WebSockets) for refund
    # notifications and should not cold-spin. Free tier sleeps after inactivity.
    plan: starter
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # ── PostgreSQL (Neon) ──
      # Single connection string. SSL is enforced automatically for remote hosts.
      # Use the Neon POOLED connection string, e.g.:
      #   postgresql://USER:PASSWORD@ep-xxx-pooler.REGION.aws.neon.tech/pos_db?sslmode=require
      # NOTE: pos_db is shared with ms-probe (read-only consumer). api-pos owns
      # the schema and seeds the Locations reference data on first boot.
      - key: DATABASE_URL
        sync: false

      # Run EF migrations + seed on boot. Keep true for the first deploy so the
      # schema is created; safe to leave true afterwards.
      - key: RUN_DB_MIGRATIONS
        value: "true"

      # ── Auth (Centralized Auth Service, owned by another team) ──
      # true → JwtBearer validates every request's token against JWT_AUTHORITY's
      # OIDC keys and RBAC is enforced. Set false only for an unauthenticated demo.
      - key: AUTH_MIDDLEWARE_ENABLED
        value: "true"
      # Public HTTPS root of the Auth Service (guide naming). Must be reachable
      # from Render. Example: https://auth.example.com
      - key: JWT_AUTHORITY
        sync: false

      # ── CORS ──
      # Public origin of the deployed web-pos (Vercel). No trailing slash.
      # Comma-separate for multiple. Set after web-pos is deployed, then redeploy.
      - key: WEB_POS_URL
        sync: false

      # ── SCMS integration (owned by another team; optional for POS demo) ──
      - key: SCMS_API_BASE_URL
        sync: false

      # ── Audit logs (optional) ──
      - key: AUDIT_SERVICE_ENABLED
        value: "false"
      - key: AUDIT_SERVICE_URL
        sync: false

      # ── Xendit payments (set your dev keys) ──
      - key: XENDIT_SECRET_KEY
        sync: false
      - key: XENDIT_PUBLIC_KEY
        sync: false
      - key: XENDIT_CALLBACK_TOKEN
        sync: false
      # Point this at your deployed web-pos sales page once known.
      - key: XENDIT_REDIRECT_URL
        sync: false

      # ── Rate limiting ──
      - key: RATE_LIMIT_ENABLED
        value: "true"
