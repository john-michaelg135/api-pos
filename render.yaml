# Render Blueprint for api-pos (.NET 10 API)
# Deploy: push this repo to GitHub, then in Render → New → Blueprint, pick this repo.
# Values marked `sync: false` are NOT in Git — set them in the Render dashboard.
services:
  - type: web
    name: api-pos
    runtime: docker
    # Free plan: no card required. Note the free tier sleeps after ~15 min of
    # inactivity (cold start on next request) and SignalR/WebSocket connections
    # drop while asleep. Fine for setup/demo; upgrade to a paid plan before a
    # live presentation if you need always-on real-time refund notifications.
    plan: free
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

      # ── PostgreSQL (Neon) ──
      # Single connection string. SSL is enforced automatically for remote hosts.
      # Use the Neon POOLED connection string, e.g.:
      #   postgresql://USER:PASSWORD@ep-xxx-pooler.REGION.aws.neon.tech/pos_db?sslmode=require
      # NOTE: pos_db is shared with ms-probe (read-only consumer). api-pos owns
      # the schema and seeds the Locations reference data on first boot.
      - key: DATABASE_URL
        sync: false

      # Run EF migrations + seed on boot. Keep true for the first deploy so the
      # schema is created; safe to leave true afterwards.
      - key: RUN_DB_MIGRATIONS
        value: "true"

      # ── Auth (Centralized Auth Service, owned by another team) ──
      # Starts DISABLED so the backend can deploy and run migrations without the
      # auth service URL or the frontend in place. When you have the production
      # auth URL, set AUTH_MIDDLEWARE_ENABLED=true and fill JWT_AUTHORITY, then
      # redeploy. With it true, JwtBearer validates every request's token against
      # JWT_AUTHORITY's OIDC keys and RBAC is enforced.
      - key: AUTH_MIDDLEWARE_ENABLED
        value: "false"
      # Public HTTPS root of the Auth Service. Example: https://auth.example.com
      # Fill this in (and flip the flag above) when auth is ready.
      - key: JWT_AUTHORITY
        value: ""

      # ── CORS ──
      # Public origin of the deployed web-pos (Vercel). No trailing slash.
      # Set after the frontend is deployed, then redeploy.
      - key: WEB_POS_URL
        value: ""

      # ── SCMS integration (owned by another team; optional for POS demo) ──
      # Left blank on purpose; the app falls back to a default and works without it.
      - key: SCMS_API_BASE_URL
        value: ""

      # ── Audit logs (optional; disabled) ──
      - key: AUDIT_SERVICE_ENABLED
        value: "false"
      - key: AUDIT_SERVICE_URL
        value: ""

      # ── Payments (Xendit) ──
      # Deferred: payment configuration is intentionally omitted from this
      # deployment. Add XENDIT_SECRET_KEY / XENDIT_PUBLIC_KEY / XENDIT_CALLBACK_TOKEN
      # / XENDIT_REDIRECT_URL later when the payment feature is enabled.

      # ── Rate limiting ──
      - key: RATE_LIMIT_ENABLED
        value: "true"
