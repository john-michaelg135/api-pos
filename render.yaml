# Render Blueprint for api-pos (.NET 10 API)
# Deploy: push this repo to GitHub, then in Render → New → Blueprint, pick this repo.
#
# Two kinds of variables:
#   value: "..."  Fixed in Git. Every Blueprint sync (any commit that changes this
#                 file) resets the service to this value, overwriting dashboard edits.
#   sync: false   Owned by the Render dashboard. Render asks for it when the Blueprint
#                 is first created and never changes it afterwards. Use this for
#                 secrets, URLs and switches that differ per deployment.
# Never give a dashboard-managed variable a `value:` here, or the next sync wipes it.
services:
  - type: web
    name: api-pos
    runtime: docker
    # Free plan: no card required. Note the free tier sleeps after ~15 min of
    # inactivity (cold start on next request) and SignalR/WebSocket connections
    # drop while asleep. Fine for setup/demo; upgrade to a paid plan before a
    # live presentation if you need always-on real-time refund notifications.
    plan: free
    dockerfilePath: ./Dockerfile.prod
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── Fixed settings (kept in Git) ──
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Run EF migrations + seed on boot; safe to leave true.
      - key: RUN_DB_MIGRATIONS
        value: "true"
      - key: PORTAL_SYSTEM_NAME
        value: POS

      # ── PostgreSQL (Neon) ──
      # Single connection string. SSL is enforced automatically for remote hosts.
      # Use the Neon POOLED connection string, e.g.:
      #   postgresql://USER:PASSWORD@ep-xxx-pooler.REGION.aws.neon.tech/pos_db?sslmode=require
      # NOTE: pos_db is shared with ms-probe (read-only consumer). api-pos owns
      # the schema and seeds the Locations reference data on first boot.
      - key: DATABASE_URL
        sync: false

      # ── Auth (Centralized Auth Service, owned by another team) ──
      # "true" makes JwtBearer validate every request's token against JWT_AUTHORITY's
      # OIDC keys. Unset or "false" = off. JWT_AUTHORITY is the Auth Service's public
      # HTTPS root, e.g. https://auth.example.com. Location APIs separately require
      # Enterprise Portal session validation.
      - key: AUTH_MIDDLEWARE_ENABLED
        sync: false
      - key: JWT_AUTHORITY
        sync: false

      # ── Enterprise Portal session validation ──
      # PORTAL_URL: the Portal's public origin, e.g. https://br-auth-three.vercel.app
      - key: PORTAL_URL
        sync: false
      - key: PORTAL_SYSTEM_SECRET
        sync: false
      # Read-only credential for listing active POS users from the Portal database.
      - key: PORTAL_DATABASE_URL
        sync: false

      # ── CORS ──
      # Public origin(s) of the deployed web-pos, comma-separated, no trailing slash.
      - key: WEB_POS_URL
        sync: false

      # ── SCMS integration (owned by another team) ──
      # SCMS_API_BASE_URL, e.g. https://br-sims.vercel.app (unset = local placeholder).
      - key: SCMS_API_BASE_URL
        sync: false
      # Key SCMS gave POS; sent as "Authorization: Bearer <key>" on every call to SCMS
      # (receive confirmations, status updates).
      - key: SCMS_API_KEY
        sync: false
      # Shared secret SCMS sends as "Authorization: Bearer <key>" on the routes it calls
      # (POST /api-pos/transfers, GET /api-pos/branches/..., POST .../sync-product).
      # At least 32 characters; give the same value to the SCMS team. Unset = off.
      - key: SCMS_SERVICE_KEY
        sync: false

      # ── Audit logs (shared API gateway, "pos" Caller) ──
      # AUDIT_SERVICE_ENABLED: rollout switch. Unset or "false" = zero outbound audit
      # calls; set "false" and redeploy to stop delivery.
      # POS_GATEWAY_URL: gateway origin, no trailing slash ({POS_GATEWAY_URL}/audit/events).
      # POS_GATEWAY_CALLER_KEY: server-only key the gateway owners issued for "pos".
      - key: AUDIT_SERVICE_ENABLED
        sync: false
      - key: POS_GATEWAY_URL
        sync: false
      - key: POS_GATEWAY_CALLER_KEY
        sync: false

      # ── Rate limiting ──
      # Unset or "true" = on (blocks duplicate submissions); "false" = off.
      - key: RATE_LIMIT_ENABLED
        sync: false

      # ── Payments (Xendit) ──
      # Deferred: payment configuration is intentionally omitted from this
      # deployment. Add XENDIT_SECRET_KEY / XENDIT_PUBLIC_KEY / XENDIT_CALLBACK_TOKEN
      # / XENDIT_REDIRECT_URL later when the payment feature is enabled.
